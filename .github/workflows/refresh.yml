name: Daily auto-refresh
on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh Number of the Day + sitemap lastmod
        run: python3 scripts/refresh.py
      - name: Commit to main
        run: |
          git config user.name "82567-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json sitemap.xml
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push origin HEAD:main
      - name: Sync live site branch (gh-pages) with main
        run: git push --force origin HEAD:gh-pages
